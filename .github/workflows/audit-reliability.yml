name: BirOvoz CPU regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r product/backend/requirements.txt pytest pytest-asyncio httpx jiwer
      - run: python -m pytest tests product/backend/tests -q
