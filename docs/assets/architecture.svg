      .head { font-size: 19px; font-weight: 700; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .card { fill: #ffffff; stroke: #d7e0ec; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .connector-teal { fill: none; stroke: #0f9b8e; stroke-width: 2.4; marker-end: url(#arrowTeal); }
      .pillText { font-size: 12px; font-weight: 700; letter-spacing: .4px; }
