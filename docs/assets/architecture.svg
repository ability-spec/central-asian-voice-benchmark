  <title id="title">BirOvoz system architecture</title>
  <desc id="desc">Architecture overview of English-to-Uzbek and Kazakh dubbing, provider routing, optional Uzbek-only local voice cloning, and the separate prompted benchmark flow.</desc>
  <defs>
